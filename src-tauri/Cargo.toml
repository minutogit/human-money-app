[package]
name = "human_money_app"
version = "0.4.0"
description = "A decentralized wallet client for the Human Money system."
authors = ["Human Money Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "human_money_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1.5"
bs58 = "0.5"
tauri = { version = "~2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
human_money_core = { git = "https://github.com/minutogit/human-money-core.git", branch = "master" }
humoco-wot = { git = "https://github.com/minutogit/humoco-web-of-trust.git", branch = "main" }
humoco-market = { path = "../crates/humoco-market" }
log = "0.4"
tauri-plugin-log = { version = "2", features = ["colored"] }
sysinfo = "0.30"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }

tauri-plugin-clipboard-manager = "2.0.0"
bip39 = "2.0"
fs_extra = "1.3.0"
chrono = "0.4.42"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
machine-uid = "0.6"
crc32fast = "1.4"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tauri = { version = "~2.11", features = ["test"] }
human_money_core = { git = "https://github.com/minutogit/human-money-core.git", branch = "master", features = ["test-utils"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1



