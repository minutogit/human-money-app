[package]
name = "human_money_app"
version = "0.2.1"
description = "A decentralized wallet client for the Human Money system."
authors = ["Human Money Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "human_money_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1.5"
tauri = { version = "~2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
human_money_core = { git = "https://github.com/minutogit/human-money-core.git", branch = "master" }
log = "0.4"
tauri-plugin-log = { version = "2", features = ["colored"] }
sysinfo = "0.30"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }

tauri-plugin-clipboard-manager = "2.0.0"
bip39 = "2.0"
fs_extra = "1.3.0"
chrono = "0.4.42"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
machine-uid = "0.6"

[dev-dependencies]
tauri = { version = "~2.11", features = ["test"] }
# Used only by the Z01 fail-closed boundary unit tests (transfers.rs) to build
# real, correctly signed 14/20 live-state quorum proofs. Both crates are already
# part of the dependency graph via humoco-proto, so no new packages are pulled.
ed25519-dalek = { version = "2.1", default-features = false }

[profile.dev]
debug = 1

[profile.test]
debug = 1



